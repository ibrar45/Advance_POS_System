<div class="reports-container">
  <h2 class="title">📊 Sales Reports</h2>

  <form [formGroup]="reportForm" class="filters">
    <label>Start Date:
      <input type="date" formControlName="startDate" />
    </label>
    <label>End Date:
      <input type="date" formControlName="endDate" />
    </label>
    <label>Product:
      <select formControlName="product">
        <option value="">-- All Products --</option>
        <option *ngFor="let product of products" [value]="product">{{ product }}</option>
      </select>
    </label>
    <label>Employee:
      <select formControlName="employee">
        <option value="">-- All Employees --</option>
        <option *ngFor="let emp of employees" [value]="emp">{{ emp }}</option>
      </select>
    </label>
    <button type="button" (click)="applyFilter()">🔍 Apply</button>
  </form>

  <div class="summary">
    <div class="card">Total Revenue: <strong>Rs. {{ totalRevenue }}</strong></div>
    <div class="card">Total Items Sold: <strong>{{ totalItemsSold }}</strong></div>
    <div class="card">Top Product: <strong>{{ topProduct }}</strong></div>
  </div>

  <div class="export-buttons">
    <button (click)="export('PDF')">Export PDF</button>
    <button (click)="export('Excel')">Export Excel</button>
    <button (click)="print()">Print</button>
  </div>

  <table class="report-table">
    <thead>
      <tr>
        <th>Date</th>
        <th>Product</th>
        <th>Category</th>
        <th>Employee</th>
        <th>Quantity</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let sale of sales">
        <td>{{ sale.date }}</td>
        <td>{{ sale.product }}</td>
        <td>{{ sale.category }}</td>
        <td>{{ sale.employee }}</td>
        <td>{{ sale.quantity }}</td>
        <td>Rs. {{ sale.total }}</td>
      </tr>
    </tbody>
  </table>

  <div class="chart-container">
     <img [src]="'https://quickchart.io/chart?c=' + encode(generateChartConfig())" alt="Sales Chart" />
  </div>
</div>
