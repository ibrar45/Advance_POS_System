<h4 class="form-title">General Setting</h4>
<div class="row">
  <div class="col-lg-12">
    <div class="card">
      <div class="card-body">

        <div class="row mt-3">
          <div class="col-6">
            <label class="form-label">Currency</label>
            <input type="text" class="form-control" value="$ United State Dollar" />
          </div>
          <div class="col-6">
            <label class="form-label">Date Format</label>
            <input type="date" class="form-control" placeholder="e.g 14-April-2025" />

          </div>
        </div>
        <div class="row mt-4">
          <div class="col-12">

            <h5 class="form-title ">Category Template</h5>

            <div style="display:flex; gap:30px">
              <div style="text-align: center; border: 1px solid #ccc; padding: 20px; margin-top: 10px;  width: 120px; border-radius: 6px;">
                <img src="https://cdn-icons-png.flaticon.com/512/1170/1170576.png" alt="Popup" width="60" height="60"><br>

                <span>Popup</span>
              </div>
              <div style="text-align: center; border: 2px solid black; padding: 20px; margin-top:10px; width: 120px; border-radius: 6px; cursor: pointer;">
                <img src="https://cdn-icons-png.flaticon.com/512/2983/2983801.png" alt="Simple" width="60" height="60"><br>
                <span>Simple</span>
              </div>
            </div>
          </div>
          <div class="row mt-5">
            <div class="col-6">

              <div style="display: flex; justify-content: flex-start; gap: 20px;">
                <button style="padding: 10px 30px; background-color: #e0e0e0; width: 100%;  border:none; border-radius: 4px; cursor: pointer;">
                  Cancel
                </button>

              </div>
            </div>
            <div class="col-6">
              <button style="padding: 10px 30px; background-color: #1a2b3c; color: white; width: 100%; border: none; border-radius: 4px; cursor: pointer; ">
                Save
              </button>
            </div>
          </div>
        </div>

          </div>
        </div>
      </div>
</div>
