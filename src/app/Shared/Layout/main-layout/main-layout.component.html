<!-- Preloader -->
<div id="preloader" *ngIf="isGettingData" class="preloader">
  <div id="status" class="text-center">
    <div class="spinner">
      <p>Loading, please wait...</p>
    </div>
  </div>
</div>

<!-- Layout Wrapper -->
<div id="layout-wrapper">
  <!-- Header -->
  <header id="page-topbar" class="header shadow-sm bg-white">
    <div class="navbar-header d-flex justify-content-between align-items-center px-4 py-2">
      <div class="d-flex align-items-center">
        <div class="navbar-brand-box me-3">
          <a href="javascript:void(0);" class="logo d-flex align-items-center">
            <img src="assets/images/ali.jpg" alt="logo" height="60" class="rounded-circle shadow-sm">
            <span class="ms-2 fw-bold fs-5 text-dark">POS System</span>
          </a>
        </div>
        <button type="button" (click)="onToggleMobileMenu()" class="btn btn-light btn-sm" id="vertical-menu-btn">
          <i class="ri-menu-2-line"></i>
        </button>
      </div>

      <div class="d-flex align-items-center">
        <button type="button" class="btn btn-outline-secondary me-3" (click)="toggleFont()">
          <i class="ri-zoom-in-fill" *ngIf="isSmallFontChecked"></i>
          <i class="ri-zoom-out-line" *ngIf="!isSmallFontChecked"></i>
        </button>

        <!-- User Dropdown -->
        <div class="dropdown">
          <button class="btn btn-light d-flex align-items-center" (click)="userMenu = !userMenu">
            <span class="avatar bg-primary text-white rounded-circle me-2">
              <i class="ri-user-3-line"></i>
            </span>
            <span>Welcome Mr. {{ fullName }}</span>
            <i class="mdi mdi-chevron-down ms-2"></i>
          </button>
          <div class="dropdown-menu dropdown-menu-end mt-2 shadow-sm" [class.show]="userMenu">
            <a class="dropdown-item text-danger" href="javascript:void(0);" (click)="logout()">
              <i class="ri-shut-down-line me-1"></i> Logout
            </a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Sidebar -->
  <div class="vertical-menu bg-white border-end">
    <div class="sidebar-flex-container d-flex flex-column h-100">
      <div id="sidebar-menu">
       <!-- Sidebar Menu -->
<ul class="metismenu list-unstyled flex-grow-1" id="side-menu">

  <!-- Manage Sales -->
  <li class="sidebar-heading">Manage Sales</li>
  <li routerLinkActive="mm-active">
    <a routerLink="/main/setup/dashboard">
      <i class="ri-dashboard-line me-2"></i> Dashboard
    </a>
  </li>
  <li routerLinkActive="mm-active">
    <a routerLink="/main/setup/products">
      <i class="ri-price-tag-3-line me-2"></i> Products Catalog
    </a>
  </li>
  <li routerLinkActive="mm-active">
    <a routerLink="/main/setup/inventory">
      <i class="ri-archive-drawer-line me-2"></i> Inventory Management
    </a>
  </li>
  <li routerLinkActive="mm-active">
    <a routerLink="/main/setup/employee">
      <i class="ri-team-line me-2"></i> Employee Management
    </a>
  </li>

  <!-- Sales -->
  <li [ngClass]="{ 'mm-active': isSalesToggle }">
    <a (click)="toggleSubMenu('sales')" class="has-arrow">
      <i class="ri-shopping-cart-line me-2"></i> Sales
    </a>
    <ul class="sub-menu" [ngClass]="{ 'mm-show': isSalesToggle }">
      <li routerLinkActive="mm-active">
        <a routerLink="/main/setup/totalsales">
          <i class="ri-file-list-line me-2"></i> Total Sales
        </a>
      </li>
      <li routerLinkActive="mm-active">
        <a routerLink="/main/setup/dashboard">
          <i class="ri-bar-chart-fill me-2"></i> Total Revenue
        </a>
      </li>
    </ul>
  </li>

  <!-- Reports and AI -->
  <li class="sidebar-heading">Smart Insights</li>
  <li routerLinkActive="mm-active">
    <a routerLink="/main/setup/report">
      <i class="ri-pie-chart-2-line me-2"></i> Reports
    </a>
  </li>
  <li routerLinkActive="mm-active">
    <a routerLink="/main/setup/ai-feature">
      <i class="ri-robot-2-line me-2"></i> AI Features
    </a>
  </li>

  <!-- Settings -->
  <li class="text-center mt-4">
    <a routerLink="/main/setup/companyinfo" class="waves-effect">
      <i class="ri-settings-3-line me-2"></i> Settings
    </a>
  </li>
</ul>

      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content bg-light">
    <div class="page-content" [ngStyle]="{ 'zoom': !isSmallFontChecked ? '90%' : '100%' }">
      <div class="container-fluid">
        <router-outlet></router-outlet>
      </div>
    </div>

    <!-- Footer -->
    <!-- <footer class="footer bg-dark text-white text-center py-3 mt-auto">
      <div class="container">
        <small>&copy; {{ currentYear }} POS System. Developed by
          <a href="https://urbanunit.gov.pk/" target="_blank" class="text-warning text-decoration-none">The Ali</a>
        </small>
      </div>
    </footer> -->
  </div>
</div>
